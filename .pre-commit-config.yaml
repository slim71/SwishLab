repos:
  - repo: local
    hooks:
      ############# COMMIT hooks ####################

      # Auto-fix Dart issues (only on staged Dart files)
      - id: dart-fix
        name: dart fix
        entry: dart fix --apply
        language: system
        pass_filenames: false
        files: ^(lib|test)/.*\.dart$
        stages: [ pre-commit ]

      # Auto-format staged Dart files (only run if .dart files changed)
      - id: dart-format-smart
        name: dart format
        entry: |
          bash -c '
            dart format -l 120 "$@" &&
            git diff --quiet -- "$@" || {
              echo "❌ Formatting applied. Run: git add ."
              # git add "$@"   # <-- uncomment to auto-stage in future
              exit 1
            }
          '
        language: system
        files: ^(lib|test)/.*\.dart$
        stages: [ pre-commit ]

      ############# PUSH hooks ####################

      # Check tests on push
      - id: flutter-test
        name: flutter test
        entry: flutter test
        language: system
        pass_filenames: false
        stages: [ manual ] # [ pre-push ]

      # Full analysis on push, to make sure not to miss anything
      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze
        language: system
        pass_filenames: false
        stages: [ pre-push ]

  # -------------------------------
  # Generic useful hooks
  # -------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: detect-private-key
      - id: pretty-format-json
        args: [ "--autofix" ]
        files: \.json$
