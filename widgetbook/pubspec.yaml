name: widgetbook_ws
description: Widgetbook workspace related to SwishLab
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # main app
  SwishLab:
    path: ../

  # widgetbook
  widgetbook: ^3.20.0
  widgetbook_annotation: ^3.9.0

  # text
  font_awesome_flutter: ^10.12.0

  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # widgetbook
  build_runner: ^2.4.6
  widgetbook_generator: ^3.20.1

flutter:
  uses-material-design: true
